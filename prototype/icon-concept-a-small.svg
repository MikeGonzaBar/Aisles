    <circle cx="372" cy="200" r="6" fill="#FFCE00"/>
    <circle cx="384" cy="216" r="6" fill="#FFCE00"/>
  </g>
  <rect x="276" y="290" width="148" height="18" rx="6" fill="#FFCE00"/>
</svg>
