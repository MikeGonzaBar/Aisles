<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Aisles — mark, small size">
  <title>Aisles — small mark (16–48px)</title>
  <rect width="512" height="512" rx="116" fill="#0E1224"/>

  <!-- shelf, chunky -->
  <rect x="40" y="392" width="432" height="16" rx="8" fill="#D4A700"/>
  <rect x="40" y="340" width="432" height="68" rx="18" fill="#FFCE00"/>
  <rect x="40" y="340" width="432" height="14" rx="7" fill="#FFD62E"/>

  <!-- one spine, for context -->
  <rect x="104" y="136" width="80" height="204" rx="10" fill="#00387B"/>
