  <rect x="252" y="120" width="196" height="220" rx="22" fill="#0B4EA2"/>
  <rect x="276" y="144" width="148" height="126" rx="12" fill="#F4EFE4"/>
  <g fill="#0E1224">
    <rect x="300" y="184" width="100" height="50" rx="25"/>
    <rect x="313" y="203" width="22" height="8" rx="4" fill="#F4EFE4"/>
