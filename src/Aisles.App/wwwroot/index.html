<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aisles</title>
  <link rel="icon" href="branding/Aisles.ico" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body>

  <header class="topbar">
    <span class="wordmark">
      <img class="brand-icon" src="branding/aisles-64.png" srcset="branding/aisles-128.png 2x" width="48" height="48" alt="" />
      AISLES
    </span>
    <span class="phase">Walk the aisles of your collection.</span>
    <label class="search-field topbar-search">
      <span class="visually-hidden">Search games</span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5Zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14Z"/></svg>
      <input id="game-filter" type="search" placeholder="Search games…" autocomplete="off" />
    </label>
    <button class="settings-trigger" id="settings-trigger" type="button" aria-haspopup="dialog">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58-1.92-3.32-2.39.96a7.3 7.3 0 0 0-1.62-.94L14.88 3h-3.84l-.36 3.18a7.3 7.3 0 0 0-1.62.94l-2.39-.96-1.92 3.32 2.03 1.58a7.5 7.5 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58 1.92 3.32 2.39-.96c.5.39 1.04.7 1.62.94l.36 3.18h3.84l.36-3.18a7.3 7.3 0 0 0 1.62-.94l2.39.96 1.92-3.32-2.03-1.58ZM12.96 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      Settings
    </button>
    <span class="badge" id="bridge-badge" hidden></span>
  </header>

  <!-- Startup state: shown until the first library payload arrives. Re-used for
       connection/payload errors, which carry the error plus Retry and Open Settings. -->
  <div id="startup-panel" class="startup-panel" role="region" aria-labelledby="startup-message">
    <p id="startup-message" class="startup-message" aria-live="polite">Loading your library&hellip;</p>
    <div id="startup-actions" class="startup-actions" hidden>
      <button id="startup-retry" class="primary-button" type="button">Retry</button>
      <button id="startup-settings" class="secondary-button" type="button">Open Settings</button>
    </div>
  </div>

  <div class="settings-backdrop" id="settings-backdrop" hidden>
    <section class="settings-dialog" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <div><h1 id="settings-title">Settings</h1><p>Choose where Aisles finds each library, emulator and RetroAchievements account.</p></div>
        <button class="icon-button" id="settings-close" type="button" aria-label="Close settings">&times;</button>
      </header>
      <div class="settings-body">
        <nav class="settings-consoles" id="settings-consoles" aria-label="Configured consoles"></nav>
        <div class="settings-editor">
          <div class="settings-identity">
            <div class="settings-console-badge" id="settings-console-badge" aria-hidden="true"></div>
            <div>
              <p class="eyebrow" id="settings-console-eyebrow">CONSOLE</p>
              <h2 id="settings-console-name"></h2>
              <p class="settings-console-meta" id="settings-console-meta"></p>
            </div>
          </div>
          <div id="settings-error" class="settings-error" role="alert" hidden></div>
          <form id="settings-form" novalidate>
            <div id="settings-fields"></div>
          </form>
        </div>
      </div>
      <footer class="settings-footer">
        <span id="settings-progress" role="status"></span>
        <button class="secondary-button" id="settings-cancel" type="button">Cancel</button>
        <button class="primary-button" id="settings-save" type="button">Save &amp; rescan</button>
      </footer>
    </section>
  </div>

  <main class="layout" aria-busy="true">
    <section class="lineup" aria-label="Console lineup">
      <canvas id="stage-canvas"></canvas>
      <div class="stage-labels" id="stage-labels"></div>
      <!-- Shown only if WebGL or the model tier fails, so platform switching survives. -->
      <ul id="console-list" class="list console-fallback"></ul>
    </section>

    <!-- The filter dock stays first in the DOM (keyboard order: filters, then the
         browse views) but renders at the bottom, so the two 3D scenes stack without
         a toolbar band between them. The console names are their own labels. -->
    <section class="library-toolbar" aria-label="Library">
      <div class="console-filter" id="console-filter" role="group" aria-label="Console filter"></div>
      <div class="view-switch" id="view-switch" role="group" aria-label="Browse view">
        <button type="button" data-view="shelf" aria-pressed="false">Shelf</button>
        <button type="button" data-view="covers" aria-pressed="false">Covers</button>
        <button type="button" data-view="list" aria-pressed="false">List</button>
      </div>
    </section>

    <section class="stage-row">
      <div class="browse" id="browse">
        <section class="shelf" aria-label="Shelf">
          <canvas id="shelf-canvas" tabindex="0" role="listbox" aria-label="Shelf games" aria-describedby="shelf-hint"></canvas>
          <img class="shelf-sign" id="shelf-sign" alt="" hidden />
          <div class="shelf-pager" id="shelf-pager">
            <button type="button" data-page="-1" aria-label="Previous shelf">&lsaquo;</button>
            <span id="shelf-label">Shelf 1 of 1</span>
            <button type="button" data-page="1" aria-label="Next shelf">&rsaquo;</button>
          </div>
          <p class="shelf-hint" id="shelf-hint">
            A 19th game opens Shelf 2. The bay slides and the consoles stay put.
          </p>
          <div id="shelf-listbox" class="shelf-listbox"></div>
          <button type="button" id="shelf-launch" class="shelf-launch" disabled>Launch selected game</button>
        </section>

        <section class="browse-view covers-view" id="covers-view" hidden aria-label="Games by cover">
          <h2 class="games-heading" id="games-heading-covers" aria-live="polite"></h2>
          <ul id="cover-grid" class="cover-grid" role="listbox" aria-label="Games by cover"></ul>
        </section>

        <section class="browse-view list-view" id="list-view" hidden aria-label="Games list">
          <h2 class="games-heading" id="games-heading-list" aria-live="polite"></h2>
          <ul id="game-list" class="list" role="listbox" aria-labelledby="games-heading-list"></ul>
        </section>
      </div>

      <section class="hero" id="hero" aria-label="Selected game"></section>
    </section>

  </main>

  <div class="console-menu" id="console-menu" role="menu" aria-label="Console actions" hidden>
    <div class="console-menu-head">
      <span class="console-menu-name" id="console-menu-name"></span>
      <span class="console-menu-meta" id="console-menu-meta"></span>
    </div>
    <button type="button" role="menuitem" data-console-action="openEmulator">Open emulator</button>
    <button type="button" role="menuitem" data-console-action="openControllerConfig">Open controller config folder</button>
    <button type="button" role="menuitem" data-console-action="checkForUpdates">Check for updates</button>
    <p class="console-menu-result" id="console-menu-result" role="status" hidden></p>
    <button type="button" role="menuitem" data-console-action="openReleasePage" hidden>Open release page</button>
    <button type="button" role="menuitem" data-console-action="openXeniaManager" hidden>Open Xenia Manager</button>
    <div class="console-menu-separator" role="separator"></div>
    <button type="button" role="menuitem" data-console-action="rescan">Rescan library</button>
  </div>

  <footer class="statusbar">
    <span id="status" role="status" aria-live="polite">Loading your library&hellip;</span>
    <span id="totals"></span>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script src="stage.js"></script>
</body>
</html>
