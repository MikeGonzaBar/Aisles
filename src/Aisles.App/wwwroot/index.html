<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aisles</title>
  <link rel="icon" href="branding/Aisles.ico" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body>

  <header class="topbar">
    <span class="wordmark">
      <img class="brand-icon" src="branding/aisles-64.png" srcset="branding/aisles-128.png 2x" width="48" height="48" alt="" />
      AISLES
    </span>
    <span class="phase">Walk the aisles of your collection.</span>
    <button class="settings-trigger" id="settings-trigger" type="button" aria-haspopup="dialog">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M19.14 12.94a7.5 7.5 0 0 0 .05-.94 7.5 7.5 0 0 0-.05-.94l2.03-1.58-1.92-3.32-2.39.96a7.3 7.3 0 0 0-1.62-.94L14.88 3h-3.84l-.36 3.18a7.3 7.3 0 0 0-1.62.94l-2.39-.96-1.92 3.32 2.03 1.58a7.5 7.5 0 0 0-.05.94c0 .32.02.63.05.94l-2.03 1.58 1.92 3.32 2.39-.96c.5.39 1.04.7 1.62.94l.36 3.18h3.84l.36-3.18a7.3 7.3 0 0 0 1.62-.94l2.39.96 1.92-3.32-2.03-1.58ZM12.96 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
      Settings
    </button>
    <span class="badge" id="bridge-badge" data-state="waiting">bridge: waiting</span>
  </header>

  <div class="settings-backdrop" id="settings-backdrop" hidden>
    <section class="settings-dialog" id="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <header class="settings-header">
        <div><h1 id="settings-title">Console settings</h1><p>Choose where Aisles finds each library and emulator.</p></div>
        <button class="icon-button" id="settings-close" type="button" aria-label="Close settings">&times;</button>
      </header>
      <div class="settings-body">
        <nav class="settings-consoles" id="settings-consoles" aria-label="Configured consoles"></nav>
        <div class="settings-editor">
          <div class="settings-identity">
            <div class="settings-console-badge" id="settings-console-badge" aria-hidden="true"></div>
            <div>
              <p class="eyebrow">CONSOLE</p>
              <h2 id="settings-console-name"></h2>
              <p class="settings-console-meta" id="settings-console-meta"></p>
            </div>
          </div>
          <div id="settings-error" class="settings-error" role="alert" hidden></div>
          <form id="settings-form" novalidate>
            <div id="settings-fields"></div>
          </form>
        </div>
      </div>
      <footer class="settings-footer">
        <span id="settings-progress" role="status"></span>
        <button class="secondary-button" id="settings-cancel" type="button">Cancel</button>
        <button class="primary-button" id="settings-save" type="button">Save &amp; rescan</button>
      </footer>
    </section>
  </div>

  <main class="layout">
    <section class="lineup" aria-label="Consoles">
      <canvas id="stage-canvas"></canvas>
      <div class="stage-labels" id="stage-labels"></div>
      <!-- Shown only if WebGL or the model tier fails, so platform switching survives. -->
      <ul id="console-list" class="list console-fallback"></ul>
    </section>

    <section class="stage-row">
      <section class="shelf" aria-label="Shelf">
        <canvas id="shelf-canvas"></canvas>
        <div class="shelf-pager" id="shelf-pager">
          <button type="button" data-page="-1" aria-label="Previous shelf">&lsaquo;</button>
          <span id="shelf-label">Shelf 1 of 1</span>
          <button type="button" data-page="1" aria-label="Next shelf">&rsaquo;</button>
        </div>
        <p class="shelf-hint" id="shelf-hint">
          A 19th game opens Shelf 2. The bay slides and the consoles stay put.
        </p>
      </section>

      <section class="hero" id="hero" aria-label="Selected game"></section>
    </section>

    <section class="panel games" aria-label="Games">
      <h2 id="games-heading">Games</h2>
      <ul id="game-list" class="list"></ul>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status">Starting&hellip;</span>
    <span id="totals"></span>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script src="stage.js"></script>
</body>
</html>
