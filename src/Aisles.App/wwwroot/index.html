<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aisles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230E1224'/%3E%3Crect x='3' y='4' width='2' height='8' fill='%23FFCE00'/%3E%3Crect x='7' y='3' width='2' height='9' fill='%23F4EFE4'/%3E%3Crect x='11' y='5' width='2' height='7' fill='%23D4A700'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="stage.css" />
</head>
<body>

  <header class="topbar">
    <span class="wordmark">AISLES</span>
    <span class="phase">Phase 3 &middot; console lineup</span>
    <span class="badge" id="bridge-badge" data-state="waiting">bridge: waiting</span>
  </header>

  <main class="layout">
    <section class="lineup" aria-label="Consoles">
      <canvas id="stage-canvas"></canvas>
      <div class="stage-labels" id="stage-labels"></div>
      <!-- Shown only if WebGL or the model tier fails, so platform switching survives. -->
      <ul id="console-list" class="list console-fallback"></ul>
    </section>

    <section class="panel games" aria-label="Games">
      <h2 id="games-heading">Games</h2>
      <ul id="game-list" class="list"></ul>
    </section>
  </main>

  <footer class="statusbar">
    <span id="status">Starting&hellip;</span>
    <span id="totals"></span>
  </footer>

  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
  <script src="stage.js"></script>
  <script type="module" src="stage3d.js"></script>
</body>
</html>
